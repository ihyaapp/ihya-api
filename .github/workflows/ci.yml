name: CI

on:
  push:
    branches: [ main,dev, 'feature/**' ]
  pull_request:
    branches: [ main,dev ]
  git branch -d feature/backend-project-foundation
jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ihya
          POSTGRES_PASSWORD: ihya_test_password
          POSTGRES_DB: ihya
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests and build
        env:
          SPRING_PROFILES_ACTIVE: ci
          DB_PASSWORD: ihya_test_password
        run: mvn --batch-mode verify