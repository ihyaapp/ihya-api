spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ihya
    username: ihya
    password: ${DB_PASSWORD}

  flyway:
    enabled: true

app:
  jwt:
    # Non-production value: only ever used by the CI test run. HS256 needs a
    # key of at least 32 bytes. Real deployments inject app.jwt.secret from
    # the environment.
    secret: ${JWT_SECRET:ci-only-jwt-signing-secret-not-for-production-use}
    access-token-expiry-minutes: 15

