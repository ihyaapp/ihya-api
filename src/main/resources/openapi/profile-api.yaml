openapi: 3.0.3
info:
  title: Ihya Profile API
  description: >
    Profile endpoints for the profile module.


    RETIRED: this file's standalone GET /v1/me (returning ProfileResponse:
    {userId, name}) is superseded by the composite GET /v1/me documented in
    identity-api.yaml, which composes identity fields (id, email, timezone,
    createdAt) with profile fields (name, interests,
    personalizePromptDismissed) into one MeResponse. See
    docs/api-contract.md's Reconciliation section. The profile module
    currently has no standalone HTTP surface of its own — its data is only
    ever read/written through identity's /v1/me endpoints.
  version: 1.0.0
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Used by mobile clients. Access token sent as Authorization header.
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: >
        Used by web clients. Access token sent as an HttpOnly Secure cookie.
        Requests must also include the CSRF header per your stated web auth design.
  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
        - timestamp
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time